services:
  - type: web
    name: gala-photos
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EVENT_NAME
        value: Éclat des Émeraudes
      - key: EVENT_SUBTITLE
        value: Fête de la Jeunesse 2026
      - key: ORGANIZER
        value: Église Baptiste Philadelphie d’Angré
      - key: PRIMARY_COLOR
        value: "#0d5c46"
      - key: ACCENT_COLOR
        value: "#D4AF37"
      - key: EVENT_SLUG
        value: gala-ebpa
      - key: ALBUMS
        value: Accueil,Cérémonie,Soirée
      - key: PUBLIC_GALLERY
        value: "true"
      - key: VOTES_ENABLED
        value: "false"
      - key: FACE_MATCH_THRESHOLD
        value: "0.5"
      - key: PUBLIC_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: uupnnr3x
      - key: CLOUDINARY_API_KEY
        value: "177175651834519"
      - key: ADMIN_PASSWORD
        sync: false
      - key: PHOTOGRAPHER_PASSWORD
        sync: false
      - key: APP_SECRET
        generateValue: true
